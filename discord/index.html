<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.PB_PAGE = {
        title: "Discord",
        description: "Entre no servidor oficial da comunidade Pingobras.",
        keywords: "Pingobras, Discord, comunidade",
      };
    </script>
    <link rel="stylesheet" href="./discord.css" />
    <script src="../src/js/site-config.js"></script>
    <script src="../src/js/engine.js"></script>
    <script src="../src/js/loader-components.js" defer></script>
    <script src="./discord.js" defer></script>
  </head>
  <body>
    <main class="discord-page main-content py-5">
      <div class="container text-center">
        <div class="discord-content mx-auto animate__animated animate__fadeInUp">
          <p class="text-uppercase small fw-semibold mb-2">Comunidade Pingobras</p>
          <h1 class="section-title mb-3">Redirecionando para o Discord</h1>
          <p class="lead mb-4">
            Aguarde um instante. Você será encaminhado para o servidor oficial.
          </p>
          <div class="discord-progress" role="status" aria-label="Preparando redirecionamento">
            <span></span>
          </div>
          <p class="small mt-3 mb-0">
            Caso o redirecionamento não aconteça, <a id="discord-fallback" href="/">volte para a página inicial</a>.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
